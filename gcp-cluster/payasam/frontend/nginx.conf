server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Reverse proxy so the browser only ever needs one port-forward (to
    # this frontend Service) -- nginx runs server-side inside the
    # cluster and can reach payasam-backend by its Kubernetes Service
    # DNS name, which the browser itself cannot.
    location /api/ {
        proxy_pass http://payasam-backend:8000/;
    }
}
