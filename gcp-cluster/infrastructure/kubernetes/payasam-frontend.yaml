apiVersion: apps/v1
kind: Deployment
metadata:
  name: payasam-frontend
  namespace: payasam
  labels:
    app: payasam-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payasam-frontend
  template:
    metadata:
      labels:
        app: payasam-frontend
    spec:
      containers:
        - name: payasam-frontend
          image: payasam/payasam-frontend:phase6
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "100Mi"
              cpu: "150m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payasam-frontend
  namespace: payasam
spec:
  selector:
    app: payasam-frontend
  ports:
    - port: 80
      targetPort: 80
