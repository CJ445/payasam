apiVersion: apps/v1
kind: Deployment
metadata:
  name: payasam-backend
  namespace: payasam
  labels:
    app: payasam-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payasam-backend
  template:
    metadata:
      labels:
        app: payasam-backend
    spec:
      serviceAccountName: payasam-backend
      containers:
        - name: payasam-backend
          image: payasam/payasam-backend:phase5
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: API_GATEWAY_URL
              value: "http://api-gateway:8000"
          envFrom:
            - configMapRef:
                name: telemetry-config
                optional: true
            - secretRef:
                name: openobserve-credentials
                optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "150Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: payasam-backend
  namespace: payasam
spec:
  selector:
    app: payasam-backend
  ports:
    - port: 8000
      targetPort: 8000
