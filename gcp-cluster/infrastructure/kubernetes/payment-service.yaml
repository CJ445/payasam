apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payasam
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payasam/payment-service:phase4
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "http://database:8000"
          envFrom:
            - configMapRef:
                name: telemetry-config
                optional: true
            - secretRef:
                name: openobserve-credentials
                optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "150Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payasam
spec:
  selector:
    app: payment-service
  ports:
    - port: 8000
      targetPort: 8000
